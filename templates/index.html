<!DOCTYPE html>
<html>
{% include 'head.html' %}

<body>
    <!-- Navigation Bar -->
    <nav class="app-navbar">
        <div class="navbar-brand">
            <span class="material-icons">school</span>
            <h1>vIAzzi</h1>
        </div>
        <div class="navbar-menu">
            <button class="navbar-btn" onclick="openDashboardModal()">
                <span class="material-icons">dashboard</span>
                <span>Dashboard</span>
            </button>
            <button class="theme-toggle-btn" onclick="toggleTheme()">
                <span class="material-icons">brightness_6</span>
            </button>
        </div>
    </nav>

    <div class="main-layout">
        {% include 'chat_container.html' %}
        {% include 'side_panel.html' %}
    </div>    {% include 'qcm_modal.html' %}
    
    <!-- Dashboard Modal -->
    <div id="dashboardModal" class="dashboard-modal" style="display: none;">
        <div class="dashboard-modal-content">
            <div class="dashboard-modal-header">
                <h2 class="dashboard-modal-title">
                    <span class="material-icons">dashboard</span>
                    Dashboard - Suivi de progression
                </h2>
                <button class="dashboard-close-btn" onclick="closeDashboardModal()">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div id="dashboardContent" class="dashboard-modal-body">
                <!-- Contenu du dashboard chargé dynamiquement -->
                <div class="loading-spinner">
                    <span class="material-icons rotating">refresh</span>
                    <p>Chargement des statistiques...</p>
                </div>
            </div>
        </div>
    </div>
    
    {% include 'scripts.html' %}
</body>

</html>
